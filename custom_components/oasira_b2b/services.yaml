# Service to clean motion files older than specified age
clean_motion_files:
  fields:
    age:
      description: The age of the files to remove in days. Default is 30 days.
      example: 30
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: days

# Add a label to an entity
add_label_to_entity:
  target: {}
  fields:
    entity_id:
      description: The entity to update
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity:

    label:
      description: The label to apply to the entity
      example: "favorite"
      required: true
      selector:
        label:

# Add a notification device to a person
create_alert:
  target: {}
  fields:
    alert_type:
      description: The type of the alert
      example: "Humidity Alert"
      required: true
      selector:
        text:
    alert_description:
      description: Details about the alert
      required: true
      selector:
        text:
          multiline: true
    status:
      description: The status of the alert
      example: "Active"
      required: true
      selector:
        select:
          options:
            - "Active"
            - "Resolved"
            - "Acknowledged"

# Confirm pending Oasira alarm
update_entity:
  target: {}
  fields:
    entity_id:
      description: The entity to update
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity:

    area_id:
      description: The new area to assign to the entity
      example: "living_room"
      required: true
      selector:
        area:

deploy_latest_config:
  target: {}

create_timeline_event:
  name: Create Timeline Event
  description: Create a timeline event for any sensor or device with automatic entity state capture
  fields:
    entity_id:
      description: The entity ID (sensor, device, etc.) that generated the event.
      example: "sensor.temperature_living_room"
      selector:
        entity:

    entity_name:
      description: Display name for the entity
      example: "Living Room Temperature"
      selector:
        text:

    event_type:
      description: Type of event (e.g., temperature_alert, humidity_warning, water_leak)
      example: "temperature_alert"
      required: true
      selector:
        text:

    media_path:
      description: Local path to an image or video file to attach to the timeline event
      example: "/config/media/snapshots/front_door/latest.jpg"
      selector:
        text:

    confidence:
      description: Detection confidence (0.0-1.0)
      selector:
        number:
          min: 0.0
          max: 1.0

    area_name:
      description: Display name for the area
      selector:
        text:

    description:
      description: Event description
      selector:
        text:

summarize_timeline_period:
  name: Summarize Timeline Period
  description: Evaluate timeline events in a period and report useful duration metrics
  fields:
    start_time:
      description: Start of evaluation period (ISO datetime). If omitted, uses hours_back.
      example: "2026-04-20T00:00:00+00:00"
      selector:
        text:

    end_time:
      description: End of evaluation period (ISO datetime). Defaults to now.
      example: "2026-04-20T23:59:59+00:00"
      selector:
        text:

    hours_back:
      description: Hours to look back when start_time is not supplied
      default: 24
      selector:
        number:
          min: 1
          max: 720
          step: 1
          mode: box

    include_entities:
      description: Optional list of entities to include in the summary
      example: ["light.living_room", "switch.dishwasher", "person.john"]
      selector:
        text:
          multiple: true

# Create event service
create_event:
  target: {}
  fields:
    entity_id:
      description: The entity that triggered the event
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity: