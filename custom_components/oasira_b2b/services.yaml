add_label_to_entity:
  target: {}
  fields:
    entity_id:
      description: The entity to update
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity:

    label:
      description: The label to apply to the entity
      example: "favorite"
      required: true
      selector:
        label:

update_entity:
  target: {}
  fields:
    entity_id:
      description: The entity to update
      example: binary_sensor.front_door
      required: true
      selector:
        entity:
    area_id:
      description: The new area to assign to the entity
      example: "living_room"
      required: true
      selector:
        area:


set_in_bed_state:
  fields:
    area_id:
      description: The area whose in-bed state should be updated
      required: true
      selector:
        area:
    state:
      description: Whether the person is in bed
      required: true
      selector:
        boolean:

send_event:
  description: Send a custom event to the Oasira Care API. Safety-like event types (smoke, carbon_monoxide, gas_leak, water_leak, security, no_movement, ...) become alerts; everything else becomes a telemetry reading.
  fields:
    event_type:
      description: Event type to report (e.g. motion, door, person, no_movement, smoke)
      example: "motion"
      required: true
      selector:
        text:
    entity_id:
      description: Optional entity to attribute the event to
      example: "binary_sensor.hallway_motion"
      required: false
      selector:
        entity:
    location:
      description: Optional area/location label for the event
      example: "Bedroom"
      required: false
      selector:
        text:
    value:
      description: Optional value for telemetry events (e.g. open, closed, home, away)
      example: "open"
      required: false
      selector:
        text:
    description:
      description: Optional human-readable description
      example: "Front door opened"
      required: false
      selector:
        text:

