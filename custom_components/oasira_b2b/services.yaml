add_label_to_entity:
  target: {}
  fields:
    entity_id:
      description: The entity to update
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity:

    label:
      description: The label to apply to the entity
      example: "favorite"
      required: true
      selector:
        label:

create_alert:
  target: {}
  fields:
    alert_type:
      description: The type of the alert
      example: "Humidity Alert"
      required: true
      selector:
        text:
    alert_description:
      description: Details about the alert
      required: true
      selector:
        text:
          multiline: true
    status:
      description: The status of the alert
      example: "Active"
      required: true
      selector:
        select:
          options:
            - "Active"
            - "Resolved"
            - "Acknowledged"

update_entity:
  target: {}
  fields:
    entity_id:
      description: The entity to update
      example: binary_sensor.front_door
      required: true
      selector:
        entity:
    area_id:
      description: The new area to assign to the entity
      example: "living_room"
      required: true
      selector:
        area:

confirm_pending_alarm:
  fields:
    entity_id:
      description: The alarm entity associated with the pending alarm
      example: alarm_control_panel.oasira_security_alarm
      selector:
        entity:
          domain: alarm_control_panel

set_in_bed_state:
  fields:
    area_id:
      description: The area whose in-bed state should be updated
      required: true
      selector:
        area:
    state:
      description: Whether the person is in bed
      required: true
      selector:
        boolean:

# Create event service
create_event:
  target: {}
  fields:
    entity_id:
      description: The entity that triggered the event
      example: "binary_sensor.front_door"
      required: true
      selector:
        entity:
